{% extends "base.html" %}
{% block conteudo %}

<h2>Minha Agenda</h2>

<div class="card">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Título</label>
        <input type="text" name="titulo" required>

        <label>Data</label>
        <input type="date" name="data" required>

        <label>Hora</label>
        <input type="time" name="hora" required>

        <button class="btn">Adicionar</button>
    </form>
</div>

<hr>

<ul>
    {% for item in agenda %}
        <li>
            📌 {{ item.data }} às {{ item.hora }} — <b>{{ item.titulo }}</b>
        </li>
    {% else %}
        <li>Nenhum compromisso cadastrado.</li>
    {% endfor %}
</ul>

{% endblock %}
