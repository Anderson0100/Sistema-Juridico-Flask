{% extends "base.html" %}
{% block conteudo %}

<h2>Editar Número Ignorado pela IA</h2>

<form method="POST" class="form-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

  <label>Nome</label>
  <input type="text" name="nome" value="{{ ignorado.nome or '' }}" required>

  <label>Número WhatsApp</label>
  <input type="text" name="numero" value="{{ ignorado.numero or '' }}" required>

  <label>
    <input type="checkbox" name="ativo" {% if ignorado.ativo %}checked{% endif %}>
    Ativo
  </label>

  <button class="btn" type="submit">Salvar alterações</button>
  <a class="btn btn-secondary" href="{{ url_for('admin.admin_numeros_ignorados_ia') }}">Cancelar</a>
</form>

{% endblock %}
